<html>

<head>
    <title> Login </title>
    <link rel="stylesheet" type="text/css" href="css/contact-form.css">
    <!-- <link rel="stylesheet" type="text/css" href="css/util.css"> -->
    <!--===============================================================================================-->
    <link rel="stylesheet" type="text/css" href="css/main.css">
    <script src="vendor/jquery/jquery-3.2.1.min.js"></script>
</head>

<body>
    <div class="login-box">
        <!-- <img src="assets/images/icons/avatar.png" class="avatar"> -->
        <br>
        <h1>Personal Information</h1>
        <form method="POST" action="#" id="contact_form">
            <p>First name *</p>
            <input id="first_name" required type="text" name="first_name" placeholder="First name">
            <p>Middle name</p>
            <input id="middle_name" type="text" name="middle_name" placeholder="Middle name">
            <p>Last name *</p>
            <input id="last_name" required type="text" name="lname" placeholder="Last name">
            <p>Phone# *</p>
            <input id="phone" required type="number" name="phone" placeholder="Phone#">
            <p>Date of Birth *</p>
            <input id="dob" required type="date" name="dob" placeholder="Date of Birth">
            <p>Country *</p>
            <input id="country" required type="text" name="country" placeholder="Country">
            <p>Address *</p>
            <input id="address" required type="text" name="address" placeholder="Address">
            <!-- <input type="submit" value="submit" id="sign_in"> -->
            <input type="hidden" value="" id="can_img">

            <div class="container-login-form-btn">
                <button type="submit" value="submit" class="login-form-btn">
                    Store
                </button>
            </div>
            <br>
            <br>
        </form>
    </div>
</body>
<script src="js/input-validation.js "></script>
<script src="js/contact_form.js"></script>

</html>
